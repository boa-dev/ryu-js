[package]
name = "ryu-fuzz"
version = "0.0.0"
authors = ["David Tolnay <dtolnay@gmail.com>", "boa-dev"]
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ryu-js = { path = ".." }

[features]
small = ["ryu-js/small"]

[[bin]]
name = "fuzz_ryu_js"
path = "fuzz_targets/fuzz_ryu_js.rs"
test = false
doc = false

[workspace]
